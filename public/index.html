<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADA - Your Voice Companion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ADA</h1>
        <p class="subtitle">Your Voice Companion</p>
        
        <div class="status" id="status">Click once to start, then just talk naturally</div>
        
        <button id="callButton" class="main-call-btn">
            <svg class="button-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
            </svg>
            <span class="button-text">Call ADA</span>
        </button>
        
        <div class="recording-indicator" id="recordingIndicator" style="display: none;">
            <div class="pulse"></div>
            <span>Listening...</span>
        </div>
        
        <div class="divider"></div>
        
        <p class="section-title">Need to reach someone?</p>
        
        <button class="contact-btn" onclick="callContact('Anthony', '+17374846609')">
            <div class="contact-avatar">
                <img src="anthony.png" alt="Anthony" class="avatar-image">
            </div>
            <div class="contact-info">
                <span class="contact-name">Anthony</span>
                <span class="contact-relation">Son</span>
            </div>
            <svg class="contact-arrow" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
        </button>
        
        <button class="contact-btn" onclick="callContact('David', '+13322802091')">
            <div class="contact-avatar">
                <img src="david.png" alt="David" class="avatar-image">
            </div>
            <div class="contact-info">
                <span class="contact-name">David</span>
                <span class="contact-relation">Daughter</span>
            </div>
            <svg class="contact-arrow" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
        </button>
        
        <button class="contact-btn" onclick="callContact('Nurse Center', '+1234567892')">
            <div class="contact-avatar" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                <svg class="avatar-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2.5" style="width: 28px; height: 28px;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                </svg>
            </div>
            <div class="contact-info">
                <span class="contact-name">Nurse Center</span>
                <span class="contact-relation">Medical Support</span>
            </div>
            <svg class="contact-arrow" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
        </button>
        
        <div class="transcript" id="transcript"></div>
    </div>
    
    <script src="app.js"></script>
    <script>
        // Get session ID from the app
        function getSessionId() {
            // Try to get from app.js if available
            if (typeof sessionId !== 'undefined') {
                return sessionId;
            }
            // Fallback: get from localStorage or generate
            let sid = localStorage.getItem('ada_sessionId');
            if (!sid) {
                sid = 'session_' + Date.now();
                localStorage.setItem('ada_sessionId', sid);
            }
            return sid;
        }

        async function callContact(name, phone) {
            const sessionId = getSessionId();
            
            // Log call attempt to MongoDB
            try {
                await fetch('/api/call-attempt', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        sessionId: sessionId,
                        target: name
                    })
                });
            } catch (error) {
                console.error('Error logging call attempt:', error);
                // Continue even if logging fails
            }

            // Proceed with call
            if (confirm(`Call ${name}?`)) {
                window.location.href = `tel:${phone}`;
            }
        }
    </script>
</body>
</html>
